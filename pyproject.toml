[project]
name = "apple-mail-mcp"
version = "0.1.0"
description = "MCP server for Apple Mail via AppleScript"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0,<3",
    "pyyaml>=6.0",
]

[project.scripts]
apple-mail-mcp = "apple_mail_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_mail_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.5",
]
